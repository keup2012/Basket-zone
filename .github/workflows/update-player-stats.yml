yaml
name: 🏀 Mise à jour automatique des statistiques joueurs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update-player-stats:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupérer le dépôt
        uses: actions/checkout@v4

      - name: 🐍 Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 📊 Mettre à jour les statistiques
        run: python update_player_stats.py

      - name: 💾 Enregistrer les nouvelles statistiques
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add player-stats.json
          git diff --cached --quiet || git commit -m "📊 Mise à jour des statistiques joueurs"
          git push
```
