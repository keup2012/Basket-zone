name: 📰 Actualités NBA automatiques

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */3 * * *"

permissions:
  contents: write

jobs:
  update-news:

    runs-on: ubuntu-latest

    steps:

      - name: 📥 Récupération du dépôt
        uses: actions/checkout@v7

      - name: 🐍 Installation de Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: 📰 Mise à jour des actualités NBA
        run: python update_news.py

      - name: 🔍 Vérification des modifications
        id: verify_changed
        run: |
          if [ -n "$(git status --porcelain news.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 💾 Sauvegarde du nouveau news.json
        if: steps.verify_changed.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add news.json

          git commit -m "📰 Mise à jour automatique des actualités NBA"

          git push
