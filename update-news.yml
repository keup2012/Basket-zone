name: 📰 Mise à jour des actualités NBA

on:
  workflow_dispatch:

  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: write

jobs:
  update-news:

    runs-on: ubuntu-latest

    steps:

      - name: 📥 Récupération du dépôt
        uses: actions/checkout@v4

      - name: 🐍 Installation de Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.x"

      - name: 📰 Mise à jour des actualités
        run: python update_news.py

      - name: 💾 Enregistrement de news.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add news.json

          if git diff --cached --quiet; then
            echo "Aucune modification à enregistrer."
          else
            git commit -m "📰 Mise à jour automatique des actualités NBA"
            git push
          fi
